media:
  - name: media
    label: Media
    input: public/media
    output: /media
    extensions: [png, jpg, jpeg, webp]
    categories: [image]
    rename: safe

settings:
  content:
    merge: true

content:
  - name: stories
    label: Stories
    type: collection
    path: src/content/stories
    format: yaml-frontmatter
    subfolders: false

    operations:
      create: true
      rename: true
      delete: true

    filename:
      template: "{fields.slug}_{fields.lang}.md"
      field: false

    view:
      fields: [title, lang, date, draft]
      primary: title
      sort: [createdAt, date, title]
      default:
        sort: date
        order: desc

    fields:
      - name: title
        label: Title
        type: string
        required: true

      - name: slug
        label: Shared slug
        type: string
        required: true
        description: Use the same URL slug for the English and Korean versions.

      - name: description
        label: Description
        type: text

      - name: intro
        label: Intro / representative sentence
        type: text

      - name: date
        label: Date
        type: date
        required: true
        options:
          format: yyyy-MM-dd

      - name: createdAt
        label: Created At
        type: date
        hidden: true
        options:
          time: true
          step: 1
          format: "yyyy-MM-dd'T'HH:mm:ssXXX"

      - name: draft
        label: Draft
        type: boolean
        default: true

      - name: lang
        label: Language
        type: select
        required: true
        description: Language must match the filename suffix _en.md or _ko.md.
        options:
          values:
            - name: en
              label: English
            - name: ko
              label: Korean

      - name: heroImage
        label: Hero image
        type: image
        options:
          media: media

      - name: spotifyUrl
        label: Spotify URL
        type: string
        description: Optional Spotify episode URL.

      - name: youtubeUrl
        label: YouTube URL
        type: string
        description: Optional watch, youtu.be, Shorts or embed URL.

      - name: formats
        label: Formats
        type: select
        required: true
        description: Choose every way this Story can be experienced.
        options:
          multiple: true
          min: 1
          values:
            - name: read
              label: Read
            - name: listen
              label: Listen
            - name: watch
              label: Watch

      - name: episode
        label: Episode (optional)
        type: string

      - name: featured
        label: Featured
        type: boolean
        default: false

      - name: body
        label: Body
        type: rich-text
        options:
          format: markdown
          media: media
          switcher: true
