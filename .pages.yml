media:
  - name: media
    label: Media
    input: public/media
    output: /media
    extensions: [png, jpg, jpeg, webp]
    categories: [image]
    rename: safe

settings:
  content:
    merge: true

content:
  - name: stories
    label: What I Feel
    type: collection
    path: src/content/stories
    format: yaml-frontmatter
    subfolders: false

    operations:
      create: true
      rename: true
      delete: true

    filename:
      template: "{fields.slug}_{fields.lang}.md"
      field: false

    view:
      fields: [title, lang, date, draft]
      primary: title
      sort: [createdAt, date, title]
      default:
        sort: date
        order: desc

    fields:
      - name: title
        label: Title
        type: string
        required: true

      - name: slug
        label: Shared slug
        type: string
        required: true
        description: Choose the final shared URL slug before the first save. Use lowercase English letters, numbers, and hyphens only; changing this later does not rename the file.
        pattern:
          regex: "^(?:[a-z0-9]+(?:-[a-z0-9]+)*|AI-canâ€™t-save-you-from-your-own-stupidity)$"
          message: Use lowercase English letters, numbers, and single hyphens only.

      - name: description
        label: Description
        type: text

      - name: intro
        label: Intro / representative sentence
        type: text

      - name: date
        label: Date
        type: date
        required: true
        options:
          format: yyyy-MM-dd

      - name: createdAt
        label: Created At
        type: date
        hidden: true
        options:
          time: true
          step: 1
          format: "yyyy-MM-dd'T'HH:mm:ssXXX"

      - name: draft
        label: Draft
        type: boolean
        default: true

      - name: lang
        label: Language
        type: select
        required: true
        description: Language must match the filename suffix _en.md or _ko.md.
        options:
          values:
            - name: en
              label: English
            - name: ko
              label: Korean

      - name: heroImage
        label: Hero image
        type: image
        options:
          media: media

      - name: spotifyUrl
        label: Spotify URL
        type: string
        description: Optional Spotify episode URL.

      - name: youtubeUrl
        label: YouTube URL
        type: string
        description: Optional watch, youtu.be, Shorts or embed URL.

      - name: topics
        label: Topics
        type: reference
        required: true
        description: Select one or more topics managed under What I Feel Topics.
        options:
          collection: what-i-feel-topics
          multiple: true
          min: 1
          search: "fields.name"
          value: "{fields.name}"
          label: "{fields.name}"

      - name: episode
        label: Episode (optional)
        type: string

      - name: featured
        label: Featured
        type: boolean
        default: false

      - name: body
        label: Body
        type: rich-text
        options:
          format: markdown
          media: media
          switcher: true

  - name: what-i-feel-topics
    label: What I Feel Topics
    type: collection
    path: src/content/what-i-feel-topics
    format: yaml-frontmatter
    subfolders: false
    exclude: [".gitkeep"]

    operations:
      create: true
      rename: true
      delete: true

    filename:
      template: "{primary}.md"
      field: false

    view:
      fields: [name]
      primary: name
      sort: [name]
      search: [name]
      default:
        sort: name
        order: asc

    fields:
      - name: name
        label: Name
        type: string
        required: true

  - name: what-i-learn
    label: What I Learn
    type: collection
    path: src/content/what-i-learn
    format: yaml-frontmatter
    subfolders: false

    operations:
      create: true
      rename: true
      delete: true

    filename:
      template: "{fields.slug}_{fields.lang}.md"
      field: false

    view:
      fields: [title, lang, topics, date, draft]
      primary: title
      sort: [createdAt, date, title]
      default:
        sort: date
        order: desc

    fields:
      - name: title
        label: Title
        type: string
        required: true

      - name: slug
        label: Shared slug
        type: string
        required: true
        description: Choose the final shared URL slug before the first save. Use lowercase English letters, numbers, and hyphens only; changing this later does not rename the file.
        pattern:
          regex: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
          message: Use lowercase English letters, numbers, and single hyphens only.

      - name: description
        label: Description
        type: text

      - name: date
        label: Date
        type: date
        required: true
        options:
          format: yyyy-MM-dd

      - name: createdAt
        label: Created At
        type: date
        hidden: true
        options:
          time: true
          step: 1
          format: "yyyy-MM-dd'T'HH:mm:ssXXX"

      - name: draft
        label: Draft
        type: boolean
        default: true

      - name: lang
        label: Language
        type: select
        required: true
        description: Language must match the filename suffix _en.md or _ko.md.
        options:
          values:
            - name: en
              label: English
            - name: ko
              label: Korean

      - name: heroImage
        label: Hero image
        type: image
        options:
          media: media

      - name: topics
        label: Topics
        type: reference
        required: true
        description: Select one or more topics managed under What I Learn Topics.
        options:
          collection: what-i-learn-topics
          multiple: true
          min: 1
          search: "fields.name"
          value: "{fields.name}"
          label: "{fields.name}"

      - name: featured
        label: Featured
        type: boolean
        default: false

      - name: body
        label: Body
        type: rich-text
        options:
          format: markdown
          media: media
          switcher: true

  - name: what-i-learn-topics
    label: What I Learn Topics
    type: collection
    path: src/content/what-i-learn-topics
    format: yaml-frontmatter
    subfolders: false
    exclude: [".gitkeep"]

    operations:
      create: true
      rename: true
      delete: true

    filename:
      template: "{primary}.md"
      field: false

    view:
      fields: [name]
      primary: name
      sort: [name]
      search: [name]
      default:
        sort: name
        order: asc

    fields:
      - name: name
        label: Name
        type: string
        required: true
