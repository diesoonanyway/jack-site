media:
  - name: media
    label: Media
    input: public/media
    output: /media
    extensions: [png, jpg, jpeg, webp]
    categories: [image]
    rename: safe

settings:
  content:
    merge: true

content:
  - name: journal
    label: Journal
    type: collection
    path: src/content/journal
    format: yaml-frontmatter
    subfolders: true

    operations:
      create: true
      rename: false
      delete: false

    filename:
      template: "{primary}.md"
      field: create

    view:
      fields: [title, lang, date, draft]
      primary: title
      sort: [date, title]
      default:
        sort: date
        order: desc

    fields:
      - name: title
        label: Title
        type: string
        required: true

      - name: description
        label: Description
        type: text

      - name: date
        label: Date
        type: date
        required: true
        options:
          format: yyyy-MM-dd

      - name: draft
        label: Draft
        type: boolean
        default: true

      - name: lang
        label: Language
        type: select
        required: true
        description: Must match the filename, index_en.md or index_ko.md.
        options:
          values:
            - name: en
              label: English
            - name: ko
              label: Korean

      - name: translation
        label: Translation
        type: string
        description: Add the matching EN or KO Journal URL after both language files exist.

      - name: body
        label: Body
        type: rich-text
        options:
          format: markdown
          media: media
          switcher: true

  - name: podcast
    label: Podcast
    type: collection
    path: src/content/podcast
    format: yaml-frontmatter
    subfolders: true

    operations:
      create: true
      rename: false
      delete: false

    filename:
      template: "{primary}/index.md"
      field: false

    view:
      layout: tree
      node:
        filename: index.md
        hideDirs: others
      fields: [title, lang, date, draft]
      primary: title
      sort: [date, title]
      default:
        sort: date
        order: desc

    fields:
      - name: title
        label: Title
        type: string
        required: true

      - name: description
        label: Description
        type: text

      - name: date
        label: Date
        type: date
        required: true
        options:
          format: yyyy-MM-dd

      - name: draft
        label: Draft
        type: boolean
        default: true

      - name: lang
        label: Language
        type: select
        required: true
        description: Each language is a separate Podcast entry with its own folder and index.md.
        options:
          values:
            - name: en
              label: English
            - name: ko
              label: Korean

      - name: episode
        label: Episode
        type: string

      - name: audioUrl
        label: Spotify URL
        type: string

      - name: body
        label: Body
        type: rich-text
        options:
          format: markdown
          media: media
          switcher: true

  - name: youtube
    label: YouTube
    type: collection
    path: src/content/youtube
    format: yaml-frontmatter
    subfolders: true

    operations:
      create: true
      rename: false
      delete: false

    filename:
      template: "{primary}/index.md"
      field: false

    view:
      layout: tree
      node:
        filename: index.md
        hideDirs: others
      fields: [title, lang, date, draft]
      primary: title
      sort: [date, title]
      default:
        sort: date
        order: desc

    fields:
      - name: title
        label: Title
        type: string
        required: true

      - name: description
        label: Description
        type: text

      - name: date
        label: Date
        type: date
        required: true
        options:
          format: yyyy-MM-dd

      - name: draft
        label: Draft
        type: boolean
        default: true

      - name: lang
        label: Language
        type: select
        required: true
        description: Each language is an independent YouTube entry with its own folder and index.md.
        options:
          values:
            - name: en
              label: English
            - name: ko
              label: Korean

      - name: youtubeId
        label: YouTube URL
        type: string
        required: true
        description: Paste a watch, youtu.be, Shorts, or embed URL.

      - name: body
        label: Body
        type: rich-text
        options:
          format: markdown
          media: media
          switcher: true
